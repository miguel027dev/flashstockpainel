services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATA_DIR: /data
      SQLITE_PATH: /data/flashstock.sqlite3
      BACKUP_DIR: /data/backups
      SECRET_KEY: local-docker-change-me
      ADMIN_EMAIL: admin@flashstock.local
      ADMIN_PASSWORD: flashstock123
      AUTO_CREATE_DB: "1"
      AUTO_BACKUP_ENABLED: "1"
      AUTO_BACKUP_INTERVAL_SECONDS: "1800"
      SESSION_COOKIE_SECURE: "0"
      WEB_CONCURRENCY: "1"
      GUNICORN_THREADS: "4"
    volumes:
      - flashstock_data:/data
volumes:
  flashstock_data:
