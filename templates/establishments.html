{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Estabelecimentos</h1><p>Lojas, depósitos e unidades de estoque.</p></div></div><div class="split"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Código</th><th>Endereço</th><th>Status</th></tr></thead><tbody>{% for e in items %}<tr><td>{{e.name}}</td><td>{{e.code or '—'}}</td><td>{{e.address or '—'}}</td><td>{{'Ativo' if e.active else 'Inativo'}}</td></tr>{% endfor %}</tbody></table></div><form method="post" class="card stack"><h2 class="section-title">Novo estabelecimento</h2><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Código</label><input name="code"></div><div class="field"><label>Endereço</label><input name="address"></div><button class="btn btn-primary">Cadastrar</button></form></div>{% endblock %}
