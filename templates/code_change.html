{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Troca de Código</h1><p>Altera o SKU mantendo histórico na auditoria.</p></div></div><form method="post" class="card stack" style="max-width:700px"><div class="field"><label>Produto</label><select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.sku}} — {{p.name}}</option>{% endfor %}</select></div><div class="field"><label>Novo código/SKU</label><input name="new_sku" required></div><div class="field"><label>Motivo</label><textarea name="reason"></textarea></div><button class="btn btn-primary">Alterar código</button></form>{% endblock %}
