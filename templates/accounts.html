{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Contas/Caixa</h1><p>Contas financeiras utilizadas nos lançamentos e conciliação.</p></div></div><div class="split"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Banco</th><th>Status</th></tr></thead><tbody>{% for a in accounts %}<tr><td>{{a.name}}</td><td>{{a.account_type}}</td><td>{{a.bank_name or '—'}}</td><td>{{'Ativa' if a.active else 'Inativa'}}</td></tr>{% endfor %}</tbody></table></div><form method="post" class="card stack"><h2 class="section-title">Nova conta</h2><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Tipo</label><select name="account_type"><option>CAIXA</option><option>BANCO</option><option>CARTEIRA</option></select></div><div class="field"><label>Banco</label><input name="bank_name"></div><button class="btn btn-primary">Cadastrar</button></form></div>{% endblock %}
