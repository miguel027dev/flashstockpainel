{% extends 'base.html' %}{% block content %}<div class="page-head no-print"><div><h1>Etiquetas de Produto</h1><p>Impressão direta pelo navegador.</p></div><button class="btn btn-primary" onclick="window.print()">Imprimir</button></div><div class="grid cards-3 label-sheet">{% for p in products %}<div class="card"><div class="metric-label">FLASH STOCK</div><h2>{{p.name}}</h2><p><b>SKU:</b> {{p.sku}}<br><b>Cor:</b> {{p.color or '—'}}<br><b>Local:</b> {{p.location_code or '—'}}</p><div class="metric-value">{{p.sale_price|money}}</div><div style="margin-top:12px;border:1px dashed var(--gold);padding:8px;text-align:center">{{p.sku}}</div></div>{% endfor %}</div>{% endblock %}
