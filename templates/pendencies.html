{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Gestão de Pendências</h1><p>Central automática do que precisa de atenção.</p></div><span class="badge warning">{{items|length}} itens</span></div><div class="card">{% for p in items %}<a class="pending-item" href="{{p.href}}"><span class="pending-dot {{p.severity}}"></span><span style="flex:1"><small class="gold">{{p.type}}</small><br><b>{{p.title}}</b><br><span class="muted">{{p.detail}}</span></span><span class="muted">Abrir →</span></a>{% else %}<div class="empty">Operação sem pendências críticas detectadas.</div>{% endfor %}</div>{% endblock %}
