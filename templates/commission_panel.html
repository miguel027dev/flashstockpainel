{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Painel de Comissões</h1><p>Consolidado por vendedor.</p></div></div><div class="grid cards-3">{% for name,total,count in rows %}<div class="card"><div class="metric-label">{{name}}</div><div class="metric-value gold">{{total|money}}</div><small class="muted">{{count}} comissão(ões)</small></div>{% else %}<div class="card muted">Sem comissões liberadas.</div>{% endfor %}</div>{% endblock %}
