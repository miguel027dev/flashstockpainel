{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Novo Pedido</h1><p>O sistema calcula custo, lucro, margem, comissão e necessidade de aprovação.</p></div></div><form method="post" class="stack"><div class="card"><div class="form-grid three"><div class="field"><label>Cliente *</label><select name="customer_id" required><option value="">Selecione</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="field"><label>Estabelecimento *</label><select name="establishment_id" required>{% for e in establishments %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></div><div class="field"><label>Entrega prevista</label><input type="date" name="expected_delivery_date"></div></div><div class="form-grid three" style="margin-top:12px"><div class="field"><label>Desconto %</label><input type="number" step="0.01" name="discount_percent" value="0"></div><div class="field"><label>Custo de frete</label><input type="number" step="0.01" name="freight_cost" value="0"></div><div class="field"><label>Custo de montagem</label><input type="number" step="0.01" name="installation_cost" value="0"></div></div><div class="field" style="margin-top:12px"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="card"><div class="toolbar" style="justify-content:space-between"><h2 class="section-title">Itens do pedido</h2><button type="button" class="btn" onclick="addOrderItem()">+ Adicionar item</button></div><div id="orderItems"><div class="item-row form-grid three" style="margin-bottom:10px"><div class="field"><label>Produto</label><select name="product_id[]" required><option value="">Selecione</option>{% for p in products %}<option value="{{p.id}}" data-price="{{p.sale_price}}">{{p.sku}} — {{p.name}}</option>{% endfor %}</select></div><div class="field"><label>Quantidade</label><input name="quantity[]" type="number" step="0.001" value="1" required></div><div class="field"><label>Preço unitário</label><input name="unit_price[]" type="number" step="0.01" placeholder="Vazio = preço cadastrado"></div></div></div><template id="orderItemTemplate"><div class="item-row form-grid three" style="margin-bottom:10px"><div class="field"><label>Produto</label><select name="product_id[]" required><option value="">Selecione</option>{% for p in products %}<option value="{{p.id}}">{{p.sku}} — {{p.name}}</option>{% endfor %}</select></div><div class="field"><label>Quantidade</label><input name="quantity[]" type="number" step="0.001" value="1" required></div><div class="field"><label>Preço unitário</label><div class="toolbar"><input name="unit_price[]" type="number" step="0.01" style="flex:1"><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">×</button></div></div></div></template></div><div class="toolbar"><button class="btn btn-primary">Criar pedido</button><a class="btn" href="/pedidos">Cancelar</a></div></form>{% endblock %}
