{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Empresa</h1><p>Dados gerais usados no ERP.</p></div></div><form method="post" class="card stack" style="max-width:820px"><div class="form-grid"><div class="field"><label>Razão social</label><input name="name" value="{{company.name if company else ''}}"></div><div class="field"><label>Nome fantasia</label><input name="trade_name" value="{{company.trade_name if company else ''}}"></div></div><div class="form-grid"><div class="field"><label>CNPJ</label><input name="document" value="{{company.document if company else ''}}"></div><div class="field"><label>Telefone</label><input name="phone" value="{{company.phone if company else ''}}"></div></div><div class="field"><label>E-mail</label><input name="email" value="{{company.email if company else ''}}"></div><div class="field"><label>Endereço</label><input name="address" value="{{company.address if company else ''}}"></div><button class="btn btn-primary">Salvar</button></form>{% endblock %}
